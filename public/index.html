<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Car 104 Lap Live</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="card" class="card">
    <div class="car">Car No. 104</div>

    <div id="laps" class="lap">--</div>
    <div class="laps-label">Laps</div>

    <p id="pit" class="pit"></p>

    <div class="times">
      <div class="time-block">
        <span class="time-label">Last Lap</span>
        <span id="lastLap" class="time-value">--</span>
      </div>
    </div>

    <p id="status" class="status"></p>
  </div>

  <!-- デバッグ情報（右下に隠して表示） -->
  <div id="debugPanel" class="debug-panel">
    <div id="debug"></div>
  </div>
  <div class="debug-toggle" onclick="document.getElementById('debugPanel').classList.toggle('open')">▸ debug</div>

  <script src="app.js"></script>
</body>
</html>
